name: CPU validation
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[train,tracking-eval,dev]'
      - run: python -m pip install --force-reinstall --no-deps opencv-contrib-python-headless==4.10.0.84
      - run: ruff check src scripts tests
      - run: ruff format --check src scripts tests
      - run: python -m pytest -q
      - run: python -m pip check
