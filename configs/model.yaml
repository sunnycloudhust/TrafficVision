# Model architecture and inference settings.
architecture: fasterrcnn_resnet50_fpn

# These should match the foreground classes in configs/dataset.yaml.
# The model adds the background class automatically, so num_classes is derived.
class_names: [car, van, bus, others]
num_classes: null

# Choose "scratch" to initialize randomly or "pretrained" to start from COCO.
initialization: scratch
pretrained_weights: DEFAULT
freeze_backbone: false

score_threshold: 0.05
nms_threshold: 0.5
box_detections_per_img: 100
min_size: 800
max_size: 1333
