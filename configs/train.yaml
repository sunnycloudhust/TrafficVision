# Detector training settings for Faster R-CNN, Fast R-CNN, or R-CNN.
dataset_root: dataset/DETRAC
model_config: configs/model.yaml
# Null selects outputs/detrac_{faster_rcnn|fast_rcnn|rcnn} by architecture.
output_dir: null
# Optional architecture override: fasterrcnn_resnet50_fpn, fast_rcnn, or rcnn.
architecture: null

# Validation is held out by sequence from DETRAC's 60 annotated training videos.
# The official DETRAC test videos are reserved for final evaluation.
validation_fraction: 0.15
seed: 42

epochs: 3
batch_size: 2
max_frames_per_sequence: 50
num_workers: 4
learning_rate: 0.005
momentum: 0.9
weight_decay: 0.0005
lr_step_size: 8
lr_gamma: 0.1

# "auto" selects CUDA, then Apple Silicon MPS, then CPU.
device: auto
pin_memory: true

# Override model.yaml for training. Pretraining uses COCO for Faster R-CNN and
# ImageNet ResNet-50 for Fast R-CNN / R-CNN; "scratch" starts randomly.
initialization: pretrained
